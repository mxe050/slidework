<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
  <title id="title">判断表の読み方</title>
  <desc id="desc">判断表の判断項目と、推奨の方向・強さに集約する流れを示す図。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#415066"/>
    </marker>
    <style>
      .bg{fill:#f5f8fb}
      .center{fill:#26313f}
      .card{fill:#fff;stroke:#d7e0e8;stroke-width:2}
      .primary{fill:#e9f6f4;stroke:#0f766e;stroke-width:2}
      .secondary{fill:#eef4ff;stroke:#315fbc;stroke-width:2}
      .patient{fill:#fff0ed;stroke:#c94a3b;stroke-width:2}
      .line{stroke:#415066;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .title{font:700 28px 'Yu Gothic','Meiryo',sans-serif;fill:#1e2530}
      .h{font:700 18px 'Yu Gothic','Meiryo',sans-serif;fill:#1e2530}
      .w{font:700 22px 'Yu Gothic','Meiryo',sans-serif;fill:#fff}
      .t{font:500 15px 'Yu Gothic','Meiryo',sans-serif;fill:#4f5d6c}
      .small{font:700 13px 'Yu Gothic','Meiryo',sans-serif;fill:#0b5852}
    </style>
  </defs>
  <rect class="bg" width="1100" height="660"/>
  <text class="title" x="50" y="58">判断表は「判断の理由」を見える化する表</text>
  <text class="t" x="50" y="88">パネリストは、価値観・負担・公平性を、効果と確実性に結びつける</text>

  <g transform="translate(420,250)">
    <rect class="center" x="0" y="0" width="260" height="132" rx="8"/>
    <text class="w" x="44" y="48">推奨の方向</text>
    <text class="w" x="70" y="84">と強さ</text>
    <text class="t" x="48" y="112" fill="#dce5ee">行う / 行わない、強い / 条件付き</text>
  </g>

  <path class="line" d="M312 164 C382 180 410 230 430 258"/>
  <path class="line" d="M548 168 V238"/>
  <path class="line" d="M788 164 C716 182 690 232 672 258"/>
  <path class="line" d="M310 374 C375 360 405 338 420 322"/>
  <path class="line" d="M548 498 V394"/>
  <path class="line" d="M790 374 C718 356 690 338 680 322"/>

  <g transform="translate(70,130)">
    <rect class="primary" x="0" y="0" width="240" height="120" rx="8"/>
    <text class="small" x="18" y="28">主要判断</text>
    <text class="h" x="18" y="58">望ましい効果</text>
    <text class="t" x="18" y="86">利益は患者にとって</text>
    <text class="t" x="18" y="108">十分に大きいか</text>
  </g>
  <g transform="translate(430,96)">
    <rect class="primary" x="0" y="0" width="240" height="120" rx="8"/>
    <text class="small" x="18" y="28">主要判断</text>
    <text class="h" x="18" y="58">望ましくない効果</text>
    <text class="t" x="18" y="86">害・負担・不安は</text>
    <text class="t" x="18" y="108">どの程度か</text>
  </g>
  <g transform="translate(790,130)">
    <rect class="primary" x="0" y="0" width="240" height="120" rx="8"/>
    <text class="small" x="18" y="28">主要判断</text>
    <text class="h" x="18" y="58">確実性</text>
    <text class="t" x="18" y="86">重大アウトカムの</text>
    <text class="t" x="18" y="108">信頼度は高いか</text>
  </g>

  <g transform="translate(70,344)">
    <rect class="patient" x="0" y="0" width="240" height="126" rx="8"/>
    <text class="small" x="18" y="28" fill="#9c342b">重点確認</text>
    <text class="h" x="18" y="58">価値観と意向</text>
    <text class="t" x="18" y="86">多くの患者が同じ選択を</text>
    <text class="t" x="18" y="108">望むか、分かれるか</text>
  </g>
  <g transform="translate(430,488)">
    <rect class="secondary" x="0" y="0" width="240" height="120" rx="8"/>
    <text class="small" x="18" y="28" fill="#315fbc">社会・実装</text>
    <text class="h" x="18" y="58">資源と実行可能性</text>
    <text class="t" x="18" y="86">費用・通院・設備・</text>
    <text class="t" x="18" y="108">人員は現実的か</text>
  </g>
  <g transform="translate(790,344)">
    <rect class="secondary" x="0" y="0" width="240" height="126" rx="8"/>
    <text class="small" x="18" y="28" fill="#315fbc">社会・実装</text>
    <text class="h" x="18" y="58">公平性・受容可能性</text>
    <text class="t" x="18" y="86">不利になる患者がいないか</text>
    <text class="t" x="18" y="108">受け入れられるか</text>
  </g>

  <rect class="card" x="70" y="548" width="300" height="70" rx="8"/>
  <text class="h" x="92" y="576">質問の形</text>
  <text class="t" x="92" y="600">「この欄の判断は患者の生活に照らして妥当ですか」</text>
</svg>
